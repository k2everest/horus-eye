name: Aegis STARK and persistent state

on:
  pull_request:
    paths: ['aegis-flow/**', '.github/workflows/aegis-stark-ci.yml']
  push:
    branches: [main]
    paths: ['aegis-flow/**', '.github/workflows/aegis-stark-ci.yml']

permissions:
  contents: read

jobs:
  pq128-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test experimental SHA-512 bindings and conditional standalone FRI arithmetic
        run: node --test aegis-flow/experiments/pq128/*.test.mjs aegis-flow/experiments/pq128/fri/*.test.mjs aegis-flow/experiments/pq128/financial/*.test.mjs
      - name: Prove and verify a public polynomial with the reference FRI implementation
        run: node aegis-flow/experiments/pq128/fri/demo.mjs --domain-log2 16 --queries 720 --report pq128-reference-fri.json
      - name: Record conditional screen without authorizing production
        run: node aegis-flow/experiments/pq128/screen.mjs > pq128-conditional-screen.json
      - uses: actions/upload-artifact@v4
        with:
          name: pq128-conditional-research-${{ github.sha }}
          path: |
            pq128-conditional-screen.json
            pq128-reference-fri.json
          retention-days: 3
          if-no-files-found: error

  reward-history-capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Mine and revalidate beyond the default block limit with bounded cache
        run: node aegis-flow/scripts/benchmark-pow-history.mjs --blocks 50001 --report work/history-capacity.json
      - uses: actions/upload-artifact@v4
        with:
          name: aegis-reward-history-${{ github.sha }}
          path: work/history-capacity.json
          retention-days: 3
          if-no-files-found: error

  real-stark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@1.100.0
      - name: Build pinned guest and verifier
        run: python3 aegis-flow/scripts/setup-stark.py
      - name: Prove and verify a real composite STARK, then apply durable state
        env:
          AEGIS_STARK_INTEGRATION: '1'
          AEGIS_STARK_PUBLIC_ARTIFACT: work/stark-smoke-public.json
        run: node --test aegis-flow/services/proof-engine/integration.test.mjs
      - name: Check SQLite crash recovery, backup and process concurrency
        run: node --test aegis-flow/services/ledger-state/*.test.mjs

      - name: Rehearse encrypted recovery against the freshly proved finalized state
        env:
          AEGIS_RECOVERY_INTEGRATION: '1'
        run: node --test aegis-flow/services/recovery/recovery.integration.test.mjs
      - name: Run local operational, migration and recovery contract tests
        run: bash aegis-flow/scripts/dev-env.sh test

      - name: Rehearse fresh-proof testnet tooling locally (not public acceptance)
        env:
          AEGIS_TESTNET_INTEGRATION: '1'
        run: node --test aegis-flow/services/testnet/campaign.integration.test.mjs
      - name: Spend a mined reward with a fresh native STARK on independent PoW nodes
        env:
          AEGIS_OPEN_POW_INTEGRATION: '1'
          AEGIS_OPEN_POW_PUBLIC_ARTIFACT: work/open-pow-v2-public.json
        run: node --test aegis-flow/services/open-chain/native.integration.test.mjs
      - name: Revalidate a native STARK through the resumable backup restore drill
        env:
          AEGIS_POW_RECOVERY_ARTIFACT: work/open-pow-v2-public.json
        run: node --test aegis-flow/services/open-chain/s3-drill.integration.test.mjs
      - name: Recover an empty node from peers and reverify the native STARK without external storage
        env:
          AEGIS_POW_RECOVERY_ARTIFACT: work/open-pow-v2-public.json
        run: node --test aegis-flow/services/open-chain/peer-recovery.integration.test.mjs aegis-flow/services/open-chain/receipt-index.integration.test.mjs aegis-flow/services/open-chain/storage-atomic.integration.test.mjs

  native-pow-wallet:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@1.100.0
      - name: Build pinned guest and verifier
        run: python3 aegis-flow/scripts/setup-stark.py
      - name: Verify native wallet reorg and encrypted PoW recovery
        env:
          AEGIS_POW_WALLET_INTEGRATION: '1'
        run: node --test aegis-flow/services/open-chain/wallet.integration.test.mjs
      - name: Verify QUEER fixed-cap supply-dependent PoW with fresh native proof and fee-only blocks
        env:
          AEGIS_QUEER_POW_INTEGRATION: '1'
        run: node --test aegis-flow/services/open-chain/queer-pow.integration.test.mjs
