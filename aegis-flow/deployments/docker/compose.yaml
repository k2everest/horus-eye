name: aegis-flow

services:
  validation-gateway:
    build:
      context: ../../services/validation-gateway
      dockerfile: Dockerfile
    image: aegis-flow/validation-gateway:dev
    environment:
      NODE_ENV: development
      PORT: 8080
      LOG_LEVEL: ${AEGIS_LOG_LEVEL:-info}
    ports:
      - "${AEGIS_GATEWAY_PORT:-8080}:8080"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8080/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

