global:
  scrape_interval: 15s
rule_files:
  - /etc/prometheus/aegis-alerts.yml
scrape_configs:
  - job_name: aegis-gateway
    scheme: https
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/aegis-monitor-token
    tls_config:
      ca_file: /run/secrets/gateway-ca.pem
    static_configs:
      - targets: ['gateway.example.internal:8443']
# Configure Alertmanager and destinations separately; no notifications are sent
# by this example. Never disable TLS certificate verification.
