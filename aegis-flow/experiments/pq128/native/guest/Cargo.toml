[package]
name = "aegis-financial512-guest"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[workspace]

[features]
default = []
zkvm = ["dep:risc0-zkvm"]

[dependencies]
risc0-zkvm = { version = "=3.1.0", default-features = false, features = ["std"], optional = true }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
hex = "=0.4.3"

[[bin]]
name = "aegis-financial512-guest"
path = "src/main.rs"
required-features = ["zkvm"]

[[bin]]
name = "native512-check"
path = "src/bin/check.rs"
required-features = []

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
