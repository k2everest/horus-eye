[package]
name = "aegis-v4-plonky3-lab"
version = "0.1.0"
edition = "2024"
publish = false

# Deliberately exact versions of the same Plonky3 0.8.0 release family.
# Reproducibility requires checking in Cargo.lock after a successful build.
[dependencies]
p3-air = "=0.8.0"
p3-baby-bear = "=0.8.0"
p3-challenger = "=0.8.0"
p3-commit = "=0.8.0"
p3-dft = "=0.8.0"
p3-field = "=0.8.0"
p3-fri = "=0.8.0"
p3-matrix = "=0.8.0"
p3-merkle-tree = "=0.8.0"
p3-symmetric = "=0.8.0"
p3-uni-stark = "=0.8.0"
p3-security = "=0.8.0"
aegis-financial512-guest = { path = "../../native/guest" }
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1.1", features = ["alloc"] }
base64 = "0.22"
rand = { version = "=0.10.1", features = ["std", "std_rng", "sys_rng"] }

[profile.release]
panic = "unwind"
opt-level = 3
