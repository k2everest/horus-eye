[package]
name = "aegis-transfer-guest"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[workspace]

[dependencies]
risc0-zkvm = { version = "=3.1.0", default-features = false, features = ["std"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
hex = "=0.4.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
