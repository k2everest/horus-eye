[package]
name = "aegis-stark-verifier"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
risc0-zkvm = { version = "=3.1.0", default-features = false, features = ["std", "disable-dev-mode"] }
serde_json = "=1.0.145"
bincode = "=1.3.3"
hex = "=0.4.3"
risc0-binfmt = "=3.0.6"
risc0-zkos-v1compat = "=2.2.3"

[profile.release]
opt-level = 3
